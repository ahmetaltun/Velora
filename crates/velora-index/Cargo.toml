[package]
name = "velora-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parking_lot = "0.12"
bitflags = { version = "2.4", features = ["serde", "bytemuck"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
memmap2 = "0.9"
bytemuck = { version = "1.18", features = ["derive"] }
