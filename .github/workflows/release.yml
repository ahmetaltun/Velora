name: Release Velora

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.4.0)'
        required: true
        default: 'v0.4.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Release (macOS 15 Sequoia, Apple Silicon arm64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "CLEAN_VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "[INFO] Target Release Tag: $TAG (Clean version: ${TAG#v})"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build Release App Bundle
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh "${{ steps.version.outputs.CLEAN_VERSION }}"

      - name: Check for Apple Signing & Notarization Secrets
        id: check-secrets
        run: |
          CERT="${{ secrets.APPLE_CERTIFICATE }}"
          APPLE_ID="${{ secrets.APPLE_ID }}"
          APPLE_PWD="${{ secrets.APPLE_PASSWORD }}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"

          if [ -n "$CERT" ]; then
            echo "SIGNING_ENABLED=true" >> "$GITHUB_OUTPUT"
            echo "[OK] APPLE_CERTIFICATE secret detected: Code signing enabled."
          else
            echo "SIGNING_ENABLED=false" >> "$GITHUB_OUTPUT"
            echo "[WARN] APPLE_CERTIFICATE missing: Unsigned build mode."
          fi

          if [ -n "$CERT" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PWD" ] && [ -n "$TEAM_ID" ]; then
            echo "NOTARIZATION_ENABLED=true" >> "$GITHUB_OUTPUT"
            echo "[OK] Notarization credentials detected (Apple ID + Team ID): Notarization enabled."
          else
            echo "NOTARIZATION_ENABLED=false" >> "$GITHUB_OUTPUT"
            echo "[WARN] Incomplete notarization credentials: Skipping Apple Notary submission."
          fi

      - name: Install Apple Certificate into Disposable Keychain
        if: steps.check-secrets.outputs.SIGNING_ENABLED == 'true'
        env:
          BUILD_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "::group::Setting up isolated keychain"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          # Decode base64 certificate (stripping whitespace and line breaks)
          echo "$BUILD_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"

          # Create and configure disposable keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import .p12 certificate and grant access to codesign tools
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to search list and set as default for this session
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"' || true)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIGINAL_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "[OK] Keychain created and certificate imported successfully."
          echo "::endgroup::"

      - name: Code Sign Velora.app with Hardened Runtime
        if: steps.check-secrets.outputs.SIGNING_ENABLED == 'true'
        env:
          SIGNING_IDENTITY_INPUT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          echo "::group::Signing Velora.app (Inside-Out)"
          IDENTITY="${SIGNING_IDENTITY_INPUT:-}"
          if [ -z "$IDENTITY" ]; then
            echo "[INFO] Auto-detecting Developer ID Application identity from keychain..."
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m 1 "Developer ID Application:" | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ -z "$IDENTITY" ]; then
            echo "[INFO] Fallback to first available codesigning identity..."
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m 1 '^[[:space:]]*[0-9]\+)' | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ -z "$IDENTITY" ]; then
            echo "[ERROR] Could not locate a valid code signing identity in keychain."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "[INFO] Using Signing Identity: $IDENTITY"
          echo "RESOLVED_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Inside-out signing (Apple TN3127): Sign nested frameworks, XPC services, and helpers first
          if [ -d "build/Velora.app/Contents/Frameworks/Sparkle.framework" ]; then
            echo "[INFO] Signing embedded Sparkle components inside-out..."
            find build/Velora.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices -type d -name "*.xpc" 2>/dev/null | while read -r xpc; do
              echo "[INFO] Signing XPC service: $xpc"
              codesign --force --timestamp --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$xpc"
            done
            if [ -f "build/Velora.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate" ]; then
              echo "[INFO] Signing Sparkle Autoupdate binary..."
              codesign --force --timestamp --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "build/Velora.app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
            fi
            if [ -d "build/Velora.app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" ]; then
              echo "[INFO] Signing Sparkle Updater.app helper..."
              codesign --force --timestamp --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "build/Velora.app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
            fi
            echo "[INFO] Signing Sparkle.framework bundle..."
            codesign --force --timestamp --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "build/Velora.app/Contents/Frameworks/Sparkle.framework"
          fi

          # Sign the main application Mach-O executable with Hardened Runtime and Entitlements
          echo "[INFO] Signing main executable Mach-O binary..."
          codesign --force --options runtime --timestamp \
            --entitlements Velora.entitlements \
            --sign "$IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            build/Velora.app/Contents/MacOS/Velora

          # Sign the top-level application bundle WITHOUT --deep to preserve nested code signatures
          echo "[INFO] Signing outer Velora.app bundle..."
          codesign --force --options runtime --timestamp \
            --entitlements Velora.entitlements \
            --sign "$IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            build/Velora.app

          echo "[INFO] Verifying application bundle signature strictly..."
          codesign --verify --deep --strict --verbose=2 build/Velora.app
          echo "[OK] Velora.app signed and verified successfully."
          echo "::endgroup::"

      - name: Notarize and Staple Velora.app with Apple Notary Service
        if: steps.check-secrets.outputs.NOTARIZATION_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "::group::Apple Notary Service Submission (Velora.app)"
          APP_NOTARIZE_ZIP="$RUNNER_TEMP/Velora-app-notarize.zip"
          echo "[INFO] Creating temporary archive for notarytool: $APP_NOTARIZE_ZIP..."
          ditto -c -k --keepParent build/Velora.app "$APP_NOTARIZE_ZIP"

          echo "[INFO] Submitting $APP_NOTARIZE_ZIP to Apple Notary Service..."
          SUBMISSION_LOG="$RUNNER_TEMP/notary_app_submit.log"

          set +e
          xcrun notarytool submit "$APP_NOTARIZE_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee "$SUBMISSION_LOG"
          NOTARY_EXIT_CODE=$?
          set -e

          SUBMISSION_ID=$(grep -E '^\s*id: ' "$SUBMISSION_LOG" | head -n 1 | awk '{print $2}')

          if [ $NOTARY_EXIT_CODE -ne 0 ] || grep -q "status: Invalid" "$SUBMISSION_LOG"; then
            echo "[ERROR] Apple Notarization for Velora.app failed!"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "[INFO] Fetching detailed notarization diagnostic log for ID: $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          echo "[OK] Notarization for Velora.app succeeded!"
          rm -f "$APP_NOTARIZE_ZIP"

          # Function to staple with retry and exponential backoff to handle CloudKit CDN replication lag
          staple_with_retry() {
            local target="$1"
            local max_attempts=6
            local delay=15
            echo "[INFO] Stapling notarization ticket to $target (with CloudKit propagation retry)..."
            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              echo "[INFO] Staple attempt $attempt of $max_attempts..."
              if xcrun stapler staple "$target"; then
                echo "[OK] Successfully stapled notarization ticket to $target."
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "[WARN] Staple attempt $attempt failed (ticket may still be propagating through CloudKit CDN). Retrying in ${delay}s..."
                sleep "$delay"
              fi
            done
            echo "[ERROR] Failed to staple notarization ticket to $target after $max_attempts attempts."
            return 1
          }

          staple_with_retry "build/Velora.app"

          echo "[INFO] Validating stapled ticket on build/Velora.app..."
          xcrun stapler validate build/Velora.app

          echo "[INFO] Validating Gatekeeper acceptance for build/Velora.app..."
          spctl --assess --type exec -vv build/Velora.app
          echo "[OK] Velora.app notarized and stapled."
          echo "::endgroup::"

      - name: Generate Sparkle Distribution Zip & Appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "::group::Generating Sparkle Appcast & Update Zip"
          ZIP_FILE="build/Velora-${{ steps.version.outputs.TAG }}.zip"
          echo "[INFO] Assembling notarized and stapled distribution zip for Sparkle in-place updates..."
          ditto -c -k --sequesterRsrc --keepParent build/Velora.app "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          GENERATE_APPCAST="./swift/.build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [ -n "$SPARKLE_KEY" ] && [ -x "$GENERATE_APPCAST" ]; then
            echo "[INFO] Running Sparkle generate_appcast with Ed25519 signing key..."
            SPARKLE_STAGING="build/sparkle_staging"
            rm -rf "$SPARKLE_STAGING"
            mkdir -p "$SPARKLE_STAGING"
            cp "$ZIP_FILE" "$SPARKLE_STAGING/"

            # Fetch existing appcast feed if available to preserve version history
            curl -fsSL "https://github.com/ahmetaltun/Velora/releases/latest/download/appcast.xml" \
              -o "$SPARKLE_STAGING/appcast.xml" 2>/dev/null || true

            echo "$SPARKLE_KEY" | "$GENERATE_APPCAST" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/ahmetaltun/Velora/releases/download/${{ steps.version.outputs.TAG }}/" \
              "$SPARKLE_STAGING"

            mv "$SPARKLE_STAGING/appcast.xml" build/appcast.xml
            rm -rf "$SPARKLE_STAGING"
            echo "[OK] Sparkle appcast.xml generated."
          else
            echo "[WARN] SPARKLE_PRIVATE_KEY secret missing or generate_appcast not found: Skipping appcast generation."
          fi
          echo "::endgroup::"

      - name: Install dmgbuild
        run: |
          echo "[INFO] Installing dmgbuild utility for headless styled DMG generation..."
          python3 -m pip install --break-system-packages dmgbuild || pipx install dmgbuild

      - name: Create Styled DMG Image
        run: |
          echo "::group::Assembling Styled DMG image"
          DMG_FILE="build/Velora-${{ steps.version.outputs.TAG }}.dmg"
          ./scripts/create_dmg.sh "${{ steps.version.outputs.TAG }}" --output "$DMG_FILE"
          echo "DMG_FILE=$DMG_FILE" >> "$GITHUB_ENV"
          echo "[OK] Styled DMG created at: $DMG_FILE"
          echo "::endgroup::"

      - name: Code Sign DMG
        if: steps.check-secrets.outputs.SIGNING_ENABLED == 'true'
        run: |
          echo "::group::Signing DMG"
          echo "[INFO] Signing DMG with identity: $RESOLVED_IDENTITY"
          codesign --force --timestamp \
            --sign "$RESOLVED_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_FILE"

          echo "[INFO] Verifying DMG signature..."
          codesign --verify --strict --verbose=2 "$DMG_FILE"
          echo "[OK] DMG signature verified."
          echo "::endgroup::"

      - name: Notarize and Staple DMG with Apple Notary Service
        if: steps.check-secrets.outputs.NOTARIZATION_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "::group::Apple Notary Service Submission (DMG)"
          echo "[INFO] Submitting $DMG_FILE to Apple Notary Service..."
          SUBMISSION_LOG="$RUNNER_TEMP/notary_dmg_submit.log"

          set +e
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee "$SUBMISSION_LOG"
          NOTARY_EXIT_CODE=$?
          set -e

          SUBMISSION_ID=$(grep -E '^\s*id: ' "$SUBMISSION_LOG" | head -n 1 | awk '{print $2}')

          if [ $NOTARY_EXIT_CODE -ne 0 ] || grep -q "status: Invalid" "$SUBMISSION_LOG"; then
            echo "[ERROR] Apple Notarization for DMG failed!"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "[INFO] Fetching detailed notarization diagnostic log for ID: $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          echo "[OK] Notarization for DMG succeeded!"

          # Function to staple with retry and exponential backoff to handle CloudKit CDN replication lag
          staple_with_retry() {
            local target="$1"
            local max_attempts=6
            local delay=15
            echo "[INFO] Stapling notarization ticket to $target (with CloudKit propagation retry)..."
            for ((attempt=1; attempt<=max_attempts; attempt++)); do
              echo "[INFO] Staple attempt $attempt of $max_attempts..."
              if xcrun stapler staple "$target"; then
                echo "[OK] Successfully stapled notarization ticket to $target."
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "[WARN] Staple attempt $attempt failed (ticket may still be propagating through CloudKit CDN). Retrying in ${delay}s..."
                sleep "$delay"
              fi
            done
            echo "[ERROR] Failed to staple notarization ticket to $target after $max_attempts attempts."
            return 1
          }

          staple_with_retry "$DMG_FILE"

          echo "[INFO] Validating stapled ticket on DMG..."
          xcrun stapler validate "$DMG_FILE"

          echo "[INFO] Validating Gatekeeper acceptance for DMG..."
          spctl -a -t open --context context:primary-signature -v "$DMG_FILE"
          echo "[OK] DMG notarized and stapled."
          echo "::endgroup::"

      - name: Generate Checksums
        run: |
          echo "::group::Generating SHA-256 Checksums"
          cd build
          DMG_BASENAME=$(basename "${{ env.DMG_FILE }}")
          ZIP_BASENAME=$(basename "${{ env.ZIP_FILE }}")
          shasum -a 256 "$DMG_BASENAME" "$ZIP_BASENAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "CHECKSUM_FILE=build/SHA256SUMS.txt" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Velora ${{ steps.version.outputs.TAG }}
          files: |
            ${{ env.DMG_FILE }}
            ${{ env.ZIP_FILE }}
            build/appcast.xml
            ${{ env.CHECKSUM_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Clean up temporary credentials
        if: always()
        run: |
          if [ -n "${{ env.KEYCHAIN_PATH }}" ]; then
            security delete-keychain "${{ env.KEYCHAIN_PATH }}" 2>/dev/null || true
            rm -f "${{ env.KEYCHAIN_PATH }}" "${{ env.KEYCHAIN_PATH }}-db" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/notary_*.log
