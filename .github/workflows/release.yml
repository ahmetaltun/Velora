name: Release Velora

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "CLEAN_VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build Release App Bundle
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh "${{ steps.version.outputs.CLEAN_VERSION }}"

      - name: Check for Apple Signing & Notarization Secrets
        id: check-secrets
        run: |
          CERT="${{ secrets.APPLE_CERTIFICATE }}"
          APPLE_ID="${{ secrets.APPLE_ID }}"
          APPLE_PWD="${{ secrets.APPLE_PASSWORD }}"
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"

          if [ -n "$CERT" ]; then
            echo "SIGNING_ENABLED=true" >> "$GITHUB_OUTPUT"
            echo "✅ Apple certificate secret detected: Code signing enabled."
          else
            echo "SIGNING_ENABLED=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ APPLE_CERTIFICATE missing. Code signing disabled."
          fi

          if [ -n "$CERT" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PWD" ] && [ -n "$TEAM_ID" ]; then
            echo "NOTARIZATION_ENABLED=true" >> "$GITHUB_OUTPUT"
            echo "✅ Apple notarization credentials detected: Notarization enabled."
          else
            echo "NOTARIZATION_ENABLED=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Incomplete notarization credentials (APPLE_ID, APPLE_PASSWORD, or APPLE_TEAM_ID missing). Notarization disabled."
          fi

      - name: Install Apple Certificate into Disposable Keychain
        if: steps.check-secrets.outputs.SIGNING_ENABLED == 'true'
        env:
          BUILD_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          # Decode base64 certificate (strip whitespace/newlines)
          echo "$BUILD_CERTIFICATE" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"

          # Create dedicated disposable keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import .p12 certificate and allow codesign tool access
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to user search list and set as default for this session
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"' || true)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIGINAL_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Code Sign Velora.app with Hardened Runtime
        if: steps.check-secrets.outputs.SIGNING_ENABLED == 'true'
        env:
          SIGNING_IDENTITY_INPUT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          IDENTITY="${SIGNING_IDENTITY_INPUT:-}"
          if [ -z "$IDENTITY" ]; then
            echo "Auto-detecting Developer ID Application certificate from keychain..."
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m 1 "Developer ID Application:" | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ -z "$IDENTITY" ]; then
            echo "Fallback to first available codesigning identity..."
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -m 1 '^[[:space:]]*[0-9]\+)' | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi

          if [ -z "$IDENTITY" ]; then
            echo "❌ Error: Could not find any valid code signing identity in keychain."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "Using Signing Identity: $IDENTITY"
          echo "RESOLVED_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Sign embedded frameworks and dylibs first (inside-out signing)
          if [ -d "build/Velora.app/Contents/Frameworks" ]; then
            find build/Velora.app/Contents/Frameworks -type f \( -name "*.dylib" -o -name "*.framework" \) 2>/dev/null | while read -r lib; do
              echo "Signing embedded library: $lib"
              codesign --force --timestamp --options runtime --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "$lib"
            done
          fi

          # Sign main app bundle with Hardened Runtime, Entitlements and Secure Timestamp
          codesign --deep --force --options runtime --timestamp \
            --entitlements Velora.entitlements \
            --sign "$IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            build/Velora.app

          echo "Verifying application bundle signature..."
          codesign --verify --deep --strict --verbose=2 build/Velora.app

      - name: Create DMG Image
        run: |
          DMG_STAGE="build/dmg_stage"
          DMG_FILE="build/Velora-${{ steps.version.outputs.TAG }}.dmg"

          rm -rf "$DMG_STAGE" "$DMG_FILE"
          mkdir -p "$DMG_STAGE"

          cp -R build/Velora.app "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"

          hdiutil create \
            -volname "Velora" \
            -srcfolder "$DMG_STAGE" \
            -ov \
            -format UDZO \
            "$DMG_FILE"

          rm -rf "$DMG_STAGE"
          echo "DMG_FILE=$DMG_FILE" >> "$GITHUB_ENV"

      - name: Code Sign DMG
        if: steps.check-secrets.outputs.SIGNING_ENABLED == 'true'
        run: |
          echo "Signing DMG with identity: $RESOLVED_IDENTITY"
          codesign --force --timestamp \
            --sign "$RESOLVED_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_FILE"

          echo "Verifying DMG signature..."
          codesign --verify --strict --verbose=2 "$DMG_FILE"

      - name: Notarize DMG with Apple Notary Service
        if: steps.check-secrets.outputs.NOTARIZATION_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Submitting $DMG_FILE to Apple Notary Service..."
          SUBMISSION_LOG="$RUNNER_TEMP/notary_submit.log"

          set +e
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee "$SUBMISSION_LOG"
          NOTARY_EXIT_CODE=$?
          set -e

          SUBMISSION_ID=$(grep -E '^\s*id: ' "$SUBMISSION_LOG" | head -n 1 | awk '{print $2}')

          if [ $NOTARY_EXIT_CODE -ne 0 ] || grep -q "status: Invalid" "$SUBMISSION_LOG"; then
            echo "❌ Apple Notarization failed!"
            if [ -n "$SUBMISSION_ID" ]; then
              echo "Fetching detailed notarization diagnostic log for ID: $SUBMISSION_ID..."
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          echo "✅ Notarization succeeded!"

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_FILE"

          echo "Validating stapler ticket..."
          xcrun stapler validate "$DMG_FILE"

          echo "Validating Gatekeeper acceptance..."
          spctl -a -t open --context context:primary-signature -v "$DMG_FILE"

      - name: Create GitHub Release and Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Velora ${{ steps.version.outputs.TAG }}
          files: ${{ env.DMG_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Clean up temporary credentials
        if: always()
        run: |
          if [ -n "${{ env.KEYCHAIN_PATH }}" ]; then
            security delete-keychain "${{ env.KEYCHAIN_PATH }}" 2>/dev/null || true
            rm -f "${{ env.KEYCHAIN_PATH }}" "${{ env.KEYCHAIN_PATH }}-db" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/notary_*.log
